name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Type-check declarations
        run: npx -y -p typescript@5.9.3 tsc --noEmit --strict --skipLibCheck types/index.d.ts
      - name: CLI smoke (clean fixture must pass at the strictest threshold)
        run: node cli/audit.js test/fixtures/clean.html --fail-on minor
      - name: CLI smoke (violations fixture must fail)
        run: |
          set +e
          node cli/audit.js test/fixtures/violations.html --fail-on critical --format json --out report.json
          code=$?
          set -e
          test "$code" -eq 1 || { echo "expected exit 1, got $code"; exit 1; }
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: violations-report
          path: report.json
          if-no-files-found: ignore
