name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Type-check declarations
        run: npx -y -p typescript@5.9.3 tsc --noEmit --strict --skipLibCheck types/index.d.ts
      - name: CLI smoke (clean fixture must pass at the strictest threshold)
        run: node cli/audit.js test/fixtures/clean.html --fail-on minor
      - name: CLI smoke (violations fixture must fail)
        run: |
          set +e
          node cli/audit.js test/fixtures/violations.html --fail-on critical --format json --out report.json
          code=$?
          set -e
          test "$code" -eq 1 || { echo "expected exit 1, got $code"; exit 1; }
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: violations-report
          path: report.json
          if-no-files-found: ignore

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Build scanner image
        run: docker build -t hurteemj-scanner .
      - name: Run container and check health + API auth
        run: |
          docker run -d --name hj -p 8080:8080 -e HJ_ADMIN_KEY=hj_ci_test_key hurteemj-scanner
          for i in $(seq 1 30); do curl -sf localhost:8080/api/health && break; sleep 2; done
          curl -sf localhost:8080/api/health
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/api/sites)" = 401
          curl -sf -H "Authorization: Bearer hj_ci_test_key" localhost:8080/api/sites
          curl -sf localhost:8080/ | grep -q 'Хүртээмж'
      - name: Scan a page inside the container
        run: |
          ID=$(curl -sf -X POST localhost:8080/api/scans -H "Authorization: Bearer hj_ci_test_key" -H 'Content-Type: application/json' -d '{"url":"https://example.com/"}' | jq -r .scan.id)
          for i in $(seq 1 60); do S=$(curl -sf -H "Authorization: Bearer hj_ci_test_key" localhost:8080/api/scans/$ID | jq -r .scan.status); [ "$S" = queued ] || [ "$S" = running ] || break; sleep 2; done
          curl -sf -H "Authorization: Bearer hj_ci_test_key" localhost:8080/api/scans/$ID | jq '.scan | {status, score, grade, error}'
          test "$S" = done
      - if: always()
        run: docker logs hj || true
